{% extends "./layouts/base.html" %}

{% block body %}

<main>

    <!-- Breadcumb Area Start -->
    <section class="ew-breadcumb-area pt-160 pb-100" data-background="{{ get_asset_url('../images/breadcumb/bg.jpg') }}" style="background-image: url('{{ get_asset_url('../images/breadcumb/bg.jpg') }}');">
        <div class="container container-1617">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ew-breadcumb-box">
                        <div class="ew-breadcumb-text">
                            <h2>Our Team</h2>
                            <span> Home <strong><i class="fa-sharp fa-regular fa-angles-right"></i> Our Team</strong> </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ew-breadcumb-shape">
            <img src="{{ get_asset_url('../images/breadcumb/shape.png') }}" alt="shape">
        </div>
    </section>
    <!-- Breadcumb Area End -->

    <!-- Team area start -->
    <section class="ew-team-area pt-124 pb-130">
        <div class="container container-1617">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ew-section-title text-center pb-40">
                        <span>Who We Are</span>
                        <h2 class="ew-text-revel-anim">Creative Team Members</h2>
                    </div>
                </div>
                <div class="col-lg-6 col-xl-3 col-xxl-3">
                    <div class="ew-team-box team-bottom">
                        <div class="ew-team-thumb">

                                <div class="ew-team-text-inner">
                                    <h3><a href="/team-details">Abu Talha</a></h3>
                                    <span>Web Developer</span>
                                    <ul>
                                        <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-linkedin-in"></i></a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 col-xl-3 col-xxl-3">
                    <div class="ew-team-box team-bottom">
                        <div class="ew-team-thumb">
                            <img src="{{ get_asset_url('../images/team/team2.jpg') }}" alt="team">

                                <div class="ew-team-text-inner">
                                    <h3><a href="/team-details">Jinnira Alam</a></h3>

                                    <ul>
                                        <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-linkedin-in"></i></a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 col-xl-3 col-xxl-3">
                    <div class="ew-team-box team-bottom2">
                        <div class="ew-team-thumb">
                            <img src="{{ get_asset_url('../images/team/team3.jpg') }}" alt="team">
                            <div class="ew-team-text">
                                <div class="ew-team-text-inner">
                                    <h3><a href="/team-details">Saad Alam</a></h3>
                                    <span>Lead Developer</span>
                                    <ul>
                                        <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-linkedin-in"></i></a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                <div class="col-lg-6 col-xl-3 col-xxl-3">
                    <div class="ew-team-box team-bottom2">
                        <div class="ew-team-thumb">
                            <img src="{{ get_asset_url('../images/team/team4.jpg') }}" alt="team">
                            <div class="ew-team-text">
                                <div class="ew-team-text-inner">
                                    <h3><a href="/team-details">Shirin Sultana</a></h3>
                                    <span>Creative Director</span>
                                    <ul>
                                        <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                                        <li><a href="#"><i class="fa-brands fa-linkedin-in"></i></a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
